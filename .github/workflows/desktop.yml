name: Desktop checks and packages

on:
  push:
    branches: [main, 'codex/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run test:platform
      - run: npm run test:ai
      - run: npm run check:docs
      - run: npm run build

  desktop:
    needs: frontend
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            rust-targets: x86_64-pc-windows-msvc
            bundles: nsis,msi
          - name: macos-universal
            os: macos-15-intel
            target: universal-apple-darwin
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
            bundles: app,dmg
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    env:
      CARGO_BUILD_JOBS: 2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          targets: ${{ matrix.rust-targets }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: src-tauri
          shared-key: desktop-${{ matrix.name }}
      - run: npm ci
      - name: Backend regression tests
        working-directory: src-tauri
        run: cargo test --locked --lib
      - name: Build frontend for smoke tests
        run: npm run build
      - name: Windows UI smoke tests
        if: runner.os == 'Windows'
        env:
          ZEEAI_FE_OUT: ${{ runner.temp }}/zeeai-fe-test
        run: npm run fe:smoke
      - name: macOS AI monitor UI smoke tests
        if: runner.os == 'macOS'
        env:
          ZEEAI_FE_OUT: ${{ runner.temp }}/zeeai-fe-test
        run: node scripts/ai-monitor-smoke.mjs
      - name: Package Windows installers
        if: runner.os == 'Windows'
        run: npm run tauri build -- --ci --target ${{ matrix.target }} --bundles ${{ matrix.bundles }} -- --locked
      - name: Package macOS universal DMG
        if: runner.os == 'macOS'
        env:
          APPLE_SIGNING_IDENTITY: '-'
        run: npm run tauri build -- --ci --target ${{ matrix.target }} --bundles ${{ matrix.bundles }} -- --locked
      - name: Upload installers
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ZeeAI-Term-${{ matrix.name }}-${{ github.sha }}
          if-no-files-found: error
          retention-days: 14
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe
            src-tauri/target/${{ matrix.target }}/release/bundle/msi/*.msi
            src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
      - name: Upload UI smoke diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: UI-smoke-${{ matrix.name }}-${{ github.sha }}
          if-no-files-found: ignore
          retention-days: 7
          path: |
            ${{ runner.temp }}/zeeai-fe-test/*.png
            ${{ runner.temp }}/zeeai-fe-test/*.json
