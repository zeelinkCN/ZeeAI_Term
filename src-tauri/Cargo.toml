[package]
name = "zeeai-terminal"
version = "0.1.9"
description = "ZeeAI Terminal - Windows multi-protocol terminal workbench"
authors = ["ZeeAI"]
license = "GPL-3.0-or-later"
repository = ""
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "zeeai_terminal_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.6", features = ["tray-icon"] }
tauri-plugin-log = "2"
tauri-plugin-dialog = "2"
portable-pty = "0.9.0"
base64 = "0.23.1"
tokio = { version = "1", features = ["fs", "io-util", "macros", "process", "rt-multi-thread", "sync", "time"] }
serialport = "4.10.1"
russh = { version = "0.53", default-features = false, features = ["ring", "flate2"] }
russh-sftp = "3.0"
keyring = { version = "3.6", features = ["windows-native"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_JobObjects",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

# 发布构建：体积优先。
#
# 之前这里什么都没有，等于全用默认值 —— 连 LTO / strip / 单 codegen-unit 都没开，
# 于是 release exe 是 16.63MB（旁边还带一个 9.4MB 的 .pdb 一起被打进安装包）。
# 这几行不碰任何业务逻辑，只影响优化与裁剪：
# - `lto = "thin"`：跨 crate 内联/去重（fat 更小但编译明显更慢，先取 thin）
# - `codegen-units = 1`：牺牲一点编译时间换更紧凑的代码
# - `strip = true`：去掉符号表
# - `panic = "abort"`：去掉 unwind 表（已确认代码里没有 catch_unwind / panic hook 依赖）
[profile.release]
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
