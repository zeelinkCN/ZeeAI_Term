[package]
name = "zeeai-terminal"
version = "0.1.3"
description = "ZeeAI Terminal - Windows multi-protocol terminal workbench"
authors = ["ZeeAI"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "zeeai_terminal_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.6", features = ["tray-icon"] }
tauri-plugin-log = "2"
tauri-plugin-dialog = "2"
portable-pty = "0.9.0"
base64 = "0.23.1"
tokio = { version = "1", features = ["fs", "io-util", "macros", "process", "rt-multi-thread", "sync", "time"] }
serialport = "4.10.1"
russh = { version = "0.53", default-features = false, features = ["ring", "flate2"] }
russh-sftp = "3.0"
keyring = { version = "3.6", features = ["windows-native"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
] }
