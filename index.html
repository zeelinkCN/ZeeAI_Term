<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ZeeAI Terminal</title>
    <!--
      启动首屏：**不依赖任何 JS / CSS 文件**，浏览器拿到 HTML 就能画。
      为什么需要它：窗口在 WebView2 画出第一帧之前就已经映射到屏幕上了，那段时间
      用户看到的是"上一次那个窗口的残留 + 一片白"（实测截图：白板，四周还露着旧窗口的边），
      这就是他说的"启动瞬间一大一小两个相同画面重影"。现在这段时间是这块深色底 + 应用名，
      等 React 首屏画好再摘掉（见 src/main.tsx）。
      也顺带解决白闪：`tauri.conf.json` 里窗口背景已经设成同一个 #1e1e1e。
    -->
    <style>
      html, body { margin: 0; height: 100%; background: #1e1e1e; }
      #boot {
        position: fixed; inset: 0; display: flex; flex-direction: column; gap: 10px;
        align-items: center; justify-content: center; background: #1e1e1e;
        color: #cccccc; font: 13px/1.6 "Segoe UI", "Microsoft YaHei", system-ui, sans-serif;
      }
      #boot .name { font-size: 15px; letter-spacing: .04em; }
      #boot .tip { color: #8a8a8a; font-size: 12px; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <div id="boot"><div class="name">ZeeAI Term</div><div class="tip">正在启动…</div></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
